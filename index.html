<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi Navneet - Ephemeral AI Chatbot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f7f7f8; display: flex; flex-direction: column; height: 100vh; }
        header { background: #ffffff; border-bottom: 1px solid #e5e5e5; padding: 15px 20px; text-align: center; }
        header h1 { font-size: 1.2rem; color: #111; }
        header p { font-size: 0.9rem; color: #666; margin-top: 4px; }
        .status { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #d9534f; margin-right: 6px; }
        .status.online { background: #5cb85c; }
        
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; max-width: 800px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 80%; line-height: 1.5; font-size: 0.95rem; white-space: pre-wrap; word-break: break-word; }
        .user { background: #007aff; color: white; align-self: flex-end; }
        .bot { background: #e9e9eb; color: #111; align-self: flex-start; }
        
        #input-container { background: #ffffff; border-top: 1px solid #e5e5e5; padding: 15px; display: flex; justify-content: center; }
        .input-box { max-width: 800px; width: 100%; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px 16px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; outline: none; }
        button { padding: 12px 20px; background: #007aff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #aaa; }
    </style>
</head>
<body>

    <header>
        <h1>Hi Navneet 👋</h1>
        <p><span id="status-dot" class="status"></span> <span id="status-text">Connecting to backend...</span></p>
    </header>

    <div id="chat-container">
        <div class="message bot">I am online and ready! Ask me anything.</div>
    </div>

    <div id="input-container">
        <div class="input-box">
            <input type="text" id="user-input" placeholder="Type a message..." onkeydown="if(event.key === 'Enter') sendMessage()" disabled>
            <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
        </div>
    </div>

    <script>
        const TUNNEL_URL = "https://projection-transcription-accordingly-staffing.trycloudflare.com";
        const ACTIVE_MODEL = "phi3:mini";
        let history = [];

        const statusDot = document.getElementById("status-dot");
        const statusText = document.getElementById("status-text");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const chatContainer = document.getElementById("chat-container");

        if (TUNNEL_URL && TUNNEL_URL.startsWith("http")) {
            statusDot.classList.add("online");
            statusText.innerText = "Online (" + ACTIVE_MODEL + ")";
            userInput.disabled = false;
            sendBtn.disabled = false;
        } else {
            statusText.innerText = "Offline / Workflow not running";
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, "user");
            userInput.value = "";
            userInput.disabled = true;
            sendBtn.disabled = true;

            history.push({ role: "user", content: text });

            const botMessageDiv = appendMessage("Thinking...", "bot");

            try {
                const response = await fetch(`${TUNNEL_URL}/api/chat`, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Origin": window.location.origin
                    },
                    body: JSON.stringify({
                        model: ACTIVE_MODEL,
                        messages: history,
                        stream: false
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP Error status: ${response.status}`);
                }

                const data = await response.json();
                const reply = data.message ? data.message.content : "Error retrieving response.";
                
                botMessageDiv.innerText = reply;
                history.push({ role: "assistant", content: reply });
            } catch (err) {
                botMessageDiv.innerText = "Error connecting to AI model: " + err.message + ". (Make sure the GitHub Action is actively running).";
            }

            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }

        function appendMessage(text, sender) {
            const msg = document.createElement("div");
            msg.className = `message ${sender}`;
            msg.innerText = text;
            chatContainer.appendChild(msg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msg;
        }
    </script>
</body>
</html>
