name: Ephemeral AI Chatbot

on:
  workflow_dispatch:
    inputs:
      hf_model:
        description: 'Select AI Model'
        required: true
        default: 'phi3:mini'
        type: choice
        options:
          - phi3:mini
          - llama3.2:3b
          - llama3.2:1b
          - qwen2.5:0.5b

jobs:
  run-chatbot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start Ollama Service
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          
          # Allow cross-origin requests from GitHub Pages
          export OLLAMA_HOST=0.0.0.0:11434
          export OLLAMA_ORIGINS=*
          nohup ollama serve > ollama.log 2>&1 &
          
          echo "Waiting for Ollama service to start..."
          sleep 5

      - name: Pull Model from Ollama Library
        run: |
          MODEL="${{ github.event.inputs.hf_model }}"
          echo "Pulling Ollama Model: $MODEL"
          ollama pull $MODEL

      - name: Expose via Cloudflare & Update GitHub Page
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          
          # Tunnel directly to Ollama API on port 11434
          cloudflared tunnel --url http://localhost:11434 > tunnel.log 2>&1 &
          sleep 8
          
          TUNNEL_URL=$(grep -oE "https://[a-zA-Z0-9.-]+\.trycloudflare\.com" tunnel.log | head -n 1)
          MODEL="${{ github.event.inputs.hf_model }}"
          
          echo "Generated Tunnel URL: $TUNNEL_URL"
          
          if [ -z "$TUNNEL_URL" ]; then
            echo "Error: Failed to retrieve Cloudflare URL."
            exit 1
          fi
          
          # Inject live URL and active model into index.html
          git checkout index.html || true
          sed -i "s|__TUNNEL_URL__|$TUNNEL_URL|g" index.html
          sed -i "s|__ACTIVE_MODEL__|$MODEL|g" index.html
          
          # Push to repository so GitHub Pages displays the chat GUI
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy live Chatbot UI: $TUNNEL_URL"
          git push
          
          echo "=================================================="
          echo "Chatbot GUI is live on GitHub Pages!"
          echo "=================================================="
          
          sleep 3500
