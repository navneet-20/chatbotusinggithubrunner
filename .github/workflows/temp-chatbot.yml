name: Ephemeral AI Chatbot

on:
  workflow_dispatch:
    inputs:
      model_size:
        description: 'Select AI Model'
        required: true
        default: 'llama3'
        type: choice
        options:
          - llama3
          - mistral
          - phi3:medium
          - qwen:0.5b

jobs:
  run-chatbot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check Available Storage & Resources
        run: |
          echo "=== Disk Space Check ==="
          df -h
          echo "=== CPU & Memory Check ==="
          lscpu | grep "CPU(s):"
          free -h

      - name: Start Ollama Service
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          
          # Allow external connections and cross-origin requests to prevent 403 errors
          export OLLAMA_HOST=0.0.0.0:11434
          export OLLAMA_ORIGINS=*
          
          # Start ollama in the background with the proper environment variables
          nohup ollama serve > ollama.log 2>&1 &
          
          echo "Waiting for Ollama service to start..."
          sleep 5

      - name: Pull Selected AI Model
        run: |
          MODEL="${{ github.event.inputs.model_size }}"
          echo "Pulling model: $MODEL"
          ollama pull $MODEL

      - name: Expose via Cloudflare Quick Tunnel
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          
          echo "=================================================="
          echo "YOUR TEMPORARY AI CHATBOT URL IS DEPLOYING BELOW:"
          echo "=================================================="
          
          cloudflared tunnel --url http://localhost:11434 &
          
          echo "Tunnel is live! You have up to 60 minutes to interact with your bot."
          sleep 3500
